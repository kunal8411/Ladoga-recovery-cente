[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # true = show 2 days of sample vitals for real patients. Set to false to use iPhone data only.
  DEMO_DATA = "true"
  # Public values and non-secret defaults that also appear in source.
  # The database URI, Clerk secret, and cron secret stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_SHORTCUT_URL,NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY,NEXT_PUBLIC_CLERK_SIGN_IN_URL,NEXT_PUBLIC_CLERK_SIGN_UP_URL,NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL,NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL,MONGODB_DB,DEMO_CENTER_LAT,DEMO_CENTER_LNG,DEMO_DATA"
